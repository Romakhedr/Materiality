<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Materiality — The Audit Companion (ACCA AA &amp; AAA)</title>
<style>
  :root{
    --navy:#14213D; --navy2:#1F3864; --gold:#B8912F; --goldlt:#D9C27E;
    --slate:#5B6472; --paper:#FAF9F6; --panel:#F1EEE6; --green:#2E7D32; --greenbg:#E7F3E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:#1a1a1a;
    font-family: Calibri, 'Segoe UI', Arial, sans-serif; font-size:17px; line-height:1.55;
  }
  h1,h2,h3, .part-title, .title{ font-family: Cambria, Georgia, 'Times New Roman', serif; }
  .cover{
    background: var(--navy); color:#fff; text-align:center;
    padding: 70px 24px 60px; border-bottom: 6px solid var(--gold);
  }
  .cover-box{ max-width: 640px; margin: 0 auto; }
  .logo{ width:130px; height:130px; margin-bottom: 22px; }
  .eyebrow{ letter-spacing:3px; color:var(--goldlt); font-weight:700; font-size:13px; }
  .title{ font-size: 58px; font-weight:800; margin: 18px 0 6px; letter-spacing:1px; }
  .title-ar{ font-size: 34px; font-weight:700; margin-bottom: 18px; }
  .subtitle{ color:var(--goldlt); font-weight:700; letter-spacing:1px; font-size:16px; }
  .subtitle-ar{ color:var(--goldlt); font-size:15px; margin-bottom: 26px; }
  .papers{ font-size:17px; line-height:1.9; margin-bottom: 22px; }
  .papers .tag{ color:var(--goldlt); font-weight:800; font-family:Cambria,serif; }
  .strap{ color:var(--goldlt); font-weight:700; font-size:12px; letter-spacing:1.5px; }
  .cover-note{ text-align:center; color:var(--slate); font-style:italic; font-size:14px; margin:22px auto 0; max-width:560px; }
  .cover-note-ar{ text-align:center; color:var(--slate); font-style:italic; font-size:14px; margin:4px auto 0; max-width:560px; }

  .toc{ max-width: 860px; margin: 40px auto; padding: 0 24px; }
  .toc h2{ color:var(--navy2); border-bottom:2px solid var(--gold); padding-bottom:10px; font-size:26px; display:flex; justify-content:space-between; }
  .toc h2 span[dir=rtl]{ font-family:Arial, sans-serif; font-size:22px; }
  .toc-ul{ list-style:none; margin:0; padding:0; }
  .toc-ul li{ border-bottom: 1px dotted #ddd; padding: 7px 0; }
  .toc-ul a{ display:flex; justify-content:space-between; gap:16px; text-decoration:none; color:#1a1a1a; }
  .toc-ul a:hover{ color: var(--navy2); }
  .toc-ul a span[dir=rtl]{ font-family:Arial,sans-serif; color:var(--slate); }
  .toc-l0 a{ font-weight:800; color:var(--navy2); font-size:18px; }
  .toc-l1 a{ font-weight:700; padding-left: 14px; }
  .toc-l2{ font-size:15px; }
  .toc-l2 a{ padding-left: 30px; color:#333; }
  .toc-l3{ font-size:14px; }
  .toc-l3 a{ padding-left: 46px; color:var(--slate); }

  .part-divider{
    background: var(--navy); color:#fff; text-align:center;
    margin: 50px auto; max-width: 900px; padding: 50px 24px; border-radius: 4px;
  }
  .part-kicker{ color:var(--goldlt); font-weight:800; letter-spacing:2px; font-size:14px; }
  .part-kicker-ar{ color:var(--goldlt); font-size:14px; margin-top:2px; }
  .part-title{ font-size:36px; font-weight:800; margin-top:18px; }
  .part-title-ar{ font-size:26px; font-weight:700; margin-top:8px; }

  main, .h, .p-en, .p-ar, .bul, .panel, .exam-banner, .mcq, .closing{ max-width: 860px; margin-left:auto; margin-right:auto; padding-left:24px; padding-right:24px; }

  .h{ border-left: 5px solid var(--navy2); padding-left: 16px !important; margin: 34px auto 8px; }
  .h1{ }
  .h1 .h-en{ font-size:27px; font-weight:800; color:var(--navy2); display:block; }
  .h1 .h-ar{ font-size:20px; font-weight:800; color:var(--navy2); display:block; font-family:Arial,sans-serif; }
  .h2 .h-en{ font-size:22px; font-weight:800; color:var(--navy2); display:block; }
  .h2 .h-ar{ font-size:18px; font-weight:800; color:var(--navy2); display:block; font-family:Arial,sans-serif; }
  .h3{ border-left-color: var(--gold); }
  .h3 .h-en{ font-size:19px; font-weight:800; color:var(--gold); display:block; }
  .h3 .h-ar{ font-size:16px; font-weight:800; color:var(--gold); display:block; font-family:Arial,sans-serif; }

  .p-en{ margin: 6px auto 4px; }
  .p-ar{ margin: 2px auto 14px; font-family:Arial, sans-serif; font-size:17px; text-align:right; color:#333; direction:rtl; }
  .p-en.em, .p-ar.em{ font-style:italic; }
  .small{ font-size:14.5px; color:var(--slate); }

  .bul{ list-style:none; padding:0; margin: 6px auto 18px; }
  .bul li{ margin-bottom:10px; padding-left:22px; position:relative; }
  .bul li::before{ content:'\25B8'; color:var(--gold); position:absolute; left:0; top:0; }
  .li-en{ display:block; }
  .li-ar{ display:block; font-family:Arial, sans-serif; color:var(--slate); text-align:right; direction:rtl; margin-top:2px; font-size:16px; }

  .panel{ background: var(--panel); border-radius:4px; padding:18px 22px; margin: 16px auto 22px; }
  .panel .p-en, .panel .p-ar{ margin:4px auto; }
  .case-label{ color:var(--gold); font-weight:800; letter-spacing:1px; font-size:13px; margin-bottom:8px; }

  .exam-banner{ background:var(--navy); color:#fff; text-align:center; padding:22px 24px; border-radius:4px; margin: 40px auto 20px; font-weight:800; }
  .exam-banner div:first-child{ font-size:22px; margin-bottom:6px; }
  .exam-banner div:last-child{ font-family:Arial,sans-serif; font-size:18px; font-weight:700; color:var(--goldlt); }

  .mcq{ border-top:3px solid var(--gold); padding-top:16px; margin: 24px auto; }
  .mcq-num{ color:var(--gold); font-weight:800; font-size:14px; margin-bottom:4px; }
  .mcq-q-en{ font-weight:700; margin: 2px 0; }
  .mcq-q-ar{ font-weight:700; font-family:Arial,sans-serif; text-align:right; direction:rtl; margin: 2px 0 10px; }
  .options{ margin: 6px 0 12px; }
  .opt{ padding:8px 12px; border-radius:4px; margin-bottom:5px; color:#1a1a1a; }
  .opt.correct{ background: var(--greenbg); color:var(--green); font-weight:700; }
  .opt b{ color: var(--slate); margin-right:8px; }
  .opt.correct b{ color:var(--green); }
  .chk{ color:var(--green); font-weight:800; }
  .explain-label{ font-weight:800; color:var(--navy2); font-size:14px; margin-top:6px; }

  .closing{ text-align:center; border-top:2px solid var(--gold); padding-top:26px; margin: 60px auto 60px; }
  .closing .p-ar{ text-align:center; margin: 8px auto; }
  .signature{ color:var(--navy2); font-weight:800; font-style:italic; margin-top:10px; }

  .topbar{ position:sticky; top:0; background:#fff; border-bottom:1px solid #e4e0d6; padding:10px 24px; font-size:13px; color:var(--slate); font-weight:700; letter-spacing:0.5px; text-align:center; z-index: 10; }
  .topbar a{ color:var(--navy2); text-decoration:none; }

  @media (max-width: 640px){
    .title{ font-size:38px; }
    .title-ar{ font-size:26px; }
    .part-title{ font-size:26px; }
    body{ font-size:16px; }
  }
</style>
</head>
